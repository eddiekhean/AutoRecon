version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: autorecon-db
    environment:
      # SA_PASSWORD must satisfy SQL Server complexity policy:
      #   ≥8 chars, with uppercase, lowercase, digit, and special character.
      # Must match DB_PASSWORD in backend/.env.
      SA_PASSWORD: "AutoRecon@Str0ng!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"   # Free Developer edition; use "Standard"/"Enterprise" for prod
    ports:
      - "1433:1433"             # SQL Server default port (PostgreSQL used 5432 / mapped to 5434)
    volumes:
      - sqlserver_data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: autorecon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  sqlserver_data:
  redis_data:
